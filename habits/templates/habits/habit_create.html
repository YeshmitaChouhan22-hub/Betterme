{% extends 'users/base.html' %}
{% block title %}Add Habit - BetterMe{% endblock %}
{% block content %}
<div class="max-w-md mx-auto">
    <div class="bg-charcoal-800 rounded-2xl border border-charcoal-700 p-8">
        <h2 class="text-2xl font-bold text-charcoal-100 mb-1">Add a New Habit</h2>
        <p class="text-charcoal-400 text-sm mb-6">What positive habit do you want to build?</p>
        <form method="POST" class="space-y-4">
            {% csrf_token %}
            <div>
                <label class="text-sm text-charcoal-400 block mb-1">Habit Name</label>
                <input type="text" name="habit_name" placeholder="e.g. Exercise, Read, Meditate" required class="w-full rounded-xl px-4 py-2 text-sm focus:outline-none focus:border-amber-500 transition">
            </div>
            <button type="submit" class="w-full bg-amber-500 hover:bg-amber-400 text-charcoal-900 font-semibold py-2 rounded-xl transition">Add Habit</button>
        </form>
        <div class="mt-4 text-center">
            <a href="{% url 'habit_list' %}" class="text-sm text-charcoal-500 hover:text-amber-400">← Back to Habits</a>
        </div>
    </div>
</div>
{% endblock %}
