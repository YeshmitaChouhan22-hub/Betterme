{% extends 'users/base.html' %}
{% block title %}New Entry - BetterMe{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <div class="bg-white rounded-2xl shadow-sm border border-peach-100 p-8">
        <h2 class="text-2xl font-bold text-gray-800 mb-1">Write in Your Journal 📓</h2>
        <p class="text-gray-400 text-sm mb-6">No judgment here. Just you and your thoughts.</p>

        <form method="POST" class="space-y-4">
            {% csrf_token %}
            <textarea name="content" rows="10" required
                placeholder="How are you feeling today? What's on your mind? What made you smile?"
                class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-peach-400 transition resize-none leading-relaxed"></textarea>
            <button type="submit"
                class="w-full bg-peach-400 hover:bg-peach-500 text-white font-medium py-2 rounded-xl transition">
                Save Entry
            </button>
        </form>
        <div class="mt-4 text-center">
            <a href="{% url 'journal_list' %}" class="text-sm text-gray-400 hover:text-peach-500">← Back to Journal</a>
        </div>
    </div>
</div>
{% endblock %}
