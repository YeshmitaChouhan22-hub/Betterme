{% extends 'users/base.html' %}
{% block title %}New Entry - BetterMe{% endblock %}
{% block content %}
<div class="max-w-2xl mx-auto">
    <div class="bg-charcoal-800 rounded-2xl border border-charcoal-700 p-8">
        <h2 class="text-2xl font-bold text-charcoal-100 mb-1">Write in Your Journal</h2>
        <p class="text-charcoal-400 text-sm mb-6">No judgment here. Just you and your thoughts.</p>
        <form method="POST" class="space-y-4">
            {% csrf_token %}
            <textarea name="content" rows="10" required placeholder="How are you feeling today? What is on your mind?" class="w-full rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-amber-500 transition resize-none leading-relaxed"></textarea>
            <button type="submit" class="w-full bg-amber-500 hover:bg-amber-400 text-charcoal-900 font-semibold py-2 rounded-xl transition">Save Entry</button>
        </form>
        <div class="mt-4 text-center">
            <a href="{% url 'journal_list' %}" class="text-sm text-charcoal-500 hover:text-amber-400">← Back to Journal</a>
        </div>
    </div>
</div>
{% endblock %}
