{% extends 'users/base.html' %}
{% block title %}Login - BetterMe{% endblock %}
{% block content %}
<div class="max-w-md mx-auto">
    <div class="bg-charcoal-800 rounded-2xl border border-charcoal-700 p-8">
        <h2 class="text-2xl font-bold text-charcoal-100 mb-1">Welcome back</h2>
        <p class="text-charcoal-400 text-sm mb-6">Good to see you again</p>
        {% if messages %}
            {% for message in messages %}
            <div class="mb-4 px-4 py-3 rounded-lg bg-charcoal-700 text-amber-400 text-sm">{{ message }}</div>
            {% endfor %}
        {% endif %}
        <form method="POST" class="space-y-4">
            {% csrf_token %}
            <div>
                <label class="text-sm text-charcoal-400 block mb-1">Username</label>
                <input type="text" name="username" required class="w-full rounded-xl px-4 py-2 text-sm focus:outline-none focus:border-amber-500 transition">
            </div>
            <div>
                <label class="text-sm text-charcoal-400 block mb-1">Password</label>
                <input type="password" name="password" required class="w-full rounded-xl px-4 py-2 text-sm focus:outline-none focus:border-amber-500 transition">
            </div>
            <button type="submit" class="w-full bg-amber-500 hover:bg-amber-400 text-charcoal-900 font-semibold py-2 rounded-xl transition">
                Login
            </button>
        </form>
        <p class="text-center text-sm text-charcoal-500 mt-4">
            No account? <a href="{% url 'register' %}" class="text-amber-400 hover:underline">Register here</a>
        </p>
    </div>
</div>
{% endblock %}
