{% extends 'users/base.html' %}
{% block title %}Login - BetterMe{% endblock %}

{% block content %}
<div class="max-w-md mx-auto">
    <div class="bg-white rounded-2xl shadow-sm border border-peach-100 p-8">
        <h2 class="text-2xl font-bold text-gray-800 mb-1">Welcome back 🌿</h2>
        <p class="text-gray-400 text-sm mb-6">So glad you're here again</p>

        <form method="POST" class="space-y-4">
            {% csrf_token %}
            <div>
                <label class="text-sm text-gray-600 block mb-1">Username</label>
                <input type="text" name="username" required
                    class="w-full border border-gray-200 rounded-xl px-4 py-2 text-sm focus:outline-none focus:border-peach-400 transition">
            </div>
            <div>
                <label class="text-sm text-gray-600 block mb-1">Password</label>
                <input type="password" name="password" required
                    class="w-full border border-gray-200 rounded-xl px-4 py-2 text-sm focus:outline-none focus:border-peach-400 transition">
            </div>
            <button type="submit"
                class="w-full bg-peach-400 hover:bg-peach-500 text-white font-medium py-2 rounded-xl transition">
                Login
            </button>
        </form>
        <p class="text-center text-sm text-gray-400 mt-4">
            Don't have an account? <a href="{% url 'register' %}" class="text-peach-500 hover:underline">Register here</a>
        </p>
    </div>
</div>
{% endblock %}
