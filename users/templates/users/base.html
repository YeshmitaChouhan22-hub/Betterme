<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}BetterMe{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        peach: {
                            50:  '#fff8f3',
                            100: '#ffe8d6',
                            200: '#ffd0b0',
                            300: '#ffb088',
                            400: '#ff8c5a',
                            500: '#f97340',
                            600: '#e05a28',
                        },
                        cream: {
                            50:  '#fffdf9',
                            100: '#fdf6ec',
                            200: '#f9ead6',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #fffdf9; }
    </style>
</head>
<body class="min-h-screen font-sans text-gray-800">

    <!-- Navbar -->
    <nav class="bg-white border-b border-peach-100 shadow-sm px-6 py-4">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <a href="{% url 'home' %}" class="text-xl font-bold text-peach-500 tracking-tight">
                🌸 BetterMe
            </a>
            {% if request.user.is_authenticated %}
            <div class="flex items-center gap-6 text-sm text-gray-600">
                <a href="{% url 'dashboard' %}" class="hover:text-peach-500 transition">Dashboard</a>
                <a href="{% url 'habit_list' %}" class="hover:text-peach-500 transition">Habits</a>
                <a href="{% url 'journal_list' %}" class="hover:text-peach-500 transition">Journal</a>
                <a href="{% url 'reflection_list' %}" class="hover:text-peach-500 transition">Reflect</a>
                <span class="text-gray-400">|</span>
                <span class="text-gray-500">Hi, {{ request.user.username }} 👋</span>
                <a href="{% url 'logout' %}" class="bg-peach-100 text-peach-600 px-3 py-1 rounded-full hover:bg-peach-200 transition">Logout</a>
            </div>
            {% else %}
            <div class="flex gap-4 text-sm">
                <a href="{% url 'login' %}" class="hover:text-peach-500 transition">Login</a>
                <a href="{% url 'register' %}" class="bg-peach-400 text-white px-4 py-1 rounded-full hover:bg-peach-500 transition">Register</a>
            </div>
            {% endif %}
        </div>
    </nav>

    <!-- Page Content -->
    <main class="max-w-4xl mx-auto px-6 py-10">
        {% if messages %}
            {% for message in messages %}
            <div class="mb-4 px-4 py-3 rounded-lg bg-peach-100 text-peach-600 text-sm">
                {{ message }}
            </div>
            {% endfor %}
        {% endif %}

        {% block content %}{% endblock %}
    </main>

</body>
</html>
